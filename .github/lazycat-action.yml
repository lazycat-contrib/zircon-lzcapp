version: 1

project:
  root: .
  build_config: lzc-build.yml
  package_file: package.yml
  output: dist/application.lpk
  target_arch: amd64

update:
  strategy: publish
  allow_downgrade: false
  version_source:
    type: image
    image: zircon

build:
  toolchains: []
  run_buildscript: false

images:
  # dockers-x/zircon publishes immutable `v{upstream release}` tags.
  - id: zircon
    target: service
    service: zircon
    source: ghcr.io/dockers-x/zircon
    channel: stable
    sort: semver
    tag_regex: '^v[0-9]+\.[0-9]+\.[0-9]+$'
    version_regex: '^v(?P<version>[0-9]+\.[0-9]+\.[0-9]+)$'
    version_template: '{version}'
    delivery:
      mode: mirror
      require_digest_match: true

stores:
  official:
    enabled: false
  private:
    enabled: true
    skip_if_version_exists: true
    name: Zircon Mir3 Server
    summary: "皓石传奇三开源服务器端（跨平台可 Docker 部署）"